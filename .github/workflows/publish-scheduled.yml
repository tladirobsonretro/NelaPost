name: Publish scheduled NelaPost posts

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run publisher
        env:
          CRON_SECRET: ${{ secrets.NELAPOST_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --location --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://nelapost.onrender.com/api/cron/publish"
